# Expects sibling checkouts of dtnpm-core (`../dtnpm-core`) and hardy (`../../hardy`).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_zigbuild: true
            archive_ext: tar.gz
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_zigbuild: true
            archive_ext: tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            use_zigbuild: false
            archive_ext: zip
          - name: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            use_zigbuild: false
            archive_ext: tar.gz

    steps:
      - name: Checkout Hardy DTN workspace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: loic-fejoz/hardy
          path: hardy
          ref: main-dtnpm
      - name: Checkout dtnpm-core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository_owner }}/dtnpm-core
          path: dtn-postmaster/dtnpm-core
      - name: Checkout dtnpm-app-basket
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: dtn-postmaster/dtnpm-app-basket

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.name == 'macos-universal' && 'x86_64-apple-darwin,aarch64-apple-darwin' || matrix.target }}
      - name: Cache protoc
        id: protoc-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/protoc
          key: protoc-29.3-linux-x86_64
      - name: Install protoc (cache miss)
        if: steps.protoc-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip"
          mkdir -p "$HOME/.local/protoc"
          unzip -q /tmp/protoc.zip -d "$HOME/.local/protoc"
      - name: Add protoc to PATH
        run: echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild
        uses: taiki-e/install-action@fa5c9474ee639e735adbd1fd9d0ae24a5309bcf0 # cargo-zigbuild
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: dtn-postmaster/dtnpm-app-basket

      - name: Build binaries (Linux zigbuild)
        if: matrix.use_zigbuild
        working-directory: dtn-postmaster/dtnpm-app-basket
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Build binaries (Windows)
        if: matrix.name == 'windows-x86_64'
        working-directory: dtn-postmaster/dtnpm-app-basket
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build binaries (macOS universal)
        if: matrix.name == 'macos-universal'
        working-directory: dtn-postmaster/dtnpm-app-basket
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          for bin in dtnbasket dtnbasket-cli; do
            lipo -create \
              target/x86_64-apple-darwin/release/$bin \
              target/aarch64-apple-darwin/release/$bin \
              -output target/universal-apple-darwin/release/$bin
          done

      - name: Package archive (Unix)
        if: matrix.archive_ext == 'tar.gz'
        working-directory: dtn-postmaster/dtnpm-app-basket
        run: |
          PKG_DIR="dtnbasket-${{ matrix.name }}"
          mkdir -p "$PKG_DIR"
          cp "target/${{ matrix.target }}/release/dtnbasket" "$PKG_DIR/"
          cp "target/${{ matrix.target }}/release/dtnbasket-cli" "$PKG_DIR/"
          cp examples/dtnbasket.toml draft-f4jxq-dtn-basket-00.txt README.md LICENSE.md "$PKG_DIR/"
          tar czf "${PKG_DIR}.tar.gz" "$PKG_DIR"

      - name: Package archive (Windows)
        if: matrix.archive_ext == 'zip'
        working-directory: dtn-postmaster/dtnpm-app-basket
        shell: pwsh
        run: |
          $pkgDir = "dtnbasket-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/dtnbasket.exe", "target/${{ matrix.target }}/release/dtnbasket-cli.exe" "$pkgDir/"
          Copy-Item examples/dtnbasket.toml, draft-f4jxq-dtn-basket-00.txt, README.md, LICENSE.md "$pkgDir/"
          Compress-Archive -Path $pkgDir -DestinationPath "${pkgDir}.zip" -Force

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.name }}
          path: dtn-postmaster/dtnpm-app-basket/dtnbasket-${{ matrix.name }}.${{ matrix.archive_ext }}

  publish-release:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626b5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: artifacts/*
