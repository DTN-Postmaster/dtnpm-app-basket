[package]
name = "dtnpm-app-basket"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "DTN Basket Protocol (RFC draft-f4jxq-dtn-basket-00) proxy service (dtnbasket) and client CLI (dtnbasket-cli)"

[[bin]]
name = "dtnbasket"
path = "src/bin_dtnbasket.rs"

[[bin]]
name = "dtnbasket-cli"
path = "src/bin_dtnbasket_cli.rs"

[dependencies]
dtnpm-core = { path = "../dtnpm-core" }

hardy-async = { path = "../../hardy/async" }
hardy-bpa = { path = "../../hardy/bpa", default-features = false, features = ["serde", "rfc9173", "tokio"] }
hardy-bpv7 = { path = "../../hardy/bpv7", features = ["std", "serde", "rfc9173"] }
hardy-cbor = { path = "../../hardy/cbor" }
hardy-eid-patterns = { path = "../../hardy/eid-patterns", features = ["serde", "dtn-pat-item"] }
hardy-proto = { path = "../../hardy/proto", features = ["serde"] }

anyhow = "1.0"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
config = { version = "0.15", features = ["yaml", "toml", "json"] }
directories = "5"
futures-util = "0.3"
hex = "0.4"
humantime = "2"
mime_guess = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustls = "0.23"
rustls-pki-types = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
time = { version = "0.3", features = ["parsing", "formatting"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
webpki-roots = "1.0"

[dev-dependencies]
tempfile = "3"
