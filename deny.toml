[graph]
targets = [
    "x86_64-unknown-linux-gnu",
]
all-features = false
no-default-features = false

[advisories]
ignore = [
    # Unmaintained transitive crates with no safe upgrade available yet (via regorus / dtnpm-core):
    "RUSTSEC-2026-0542", # humantime
    "RUSTSEC-2026-0543", # chrono
    "RUSTSEC-2026-0555", # chrono-tz
    # VEX not_affected (CRA Annex I): transitive libsqlite3-sys v0.38.2 via dtnpm-core -> rusqlite v0.40.2;
    # SQLite / -wal recovery paths are unreachable in dtnpm-app-basket. See SECURITY.md.
    { id = "RUSTSEC-2026-0459", reason = "VEX not_affected: transitive via dtnpm-core -> rusqlite v0.40.2; dtnpm-app-basket never opens SQLite DB or -wal files" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "BSL-1.0",
    "NCSA",
    "CDLA-Permissive-2.0",
    "BlueOak-1.0.0",
    "0BSD",
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
